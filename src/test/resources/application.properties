# Fake topic so @Value("${general.kafka-topic}") resolves
general.kafka-topic=dummy-topic

# Minimal Kafka producer config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Optional: prevent auto-creation to avoid errors if Kafka isn?t running
spring.kafka.admin.auto-create=false
spring.kafka.client-id=test-client
